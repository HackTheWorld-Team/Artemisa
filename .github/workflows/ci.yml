name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type check
        run: npx tsc --noEmit
      # Blocking since #729: with continue-on-error the repo drifted to 29
      # unformatted files and every PR touching them carried format noise.
      - name: Format check
        run: npx prettier --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - name: Unit tests (shard ${{ matrix.shard }}/3)
        run: |
          files=$(ls test/*.test.mjs | awk "NR % 3 == ${{ matrix.shard }} - 1")
          node --import tsx/esm --test --test-concurrency=4 $files
      - name: Integration tests
        if: matrix.shard == 1
        run: npm test

  frontend-test:
    # The frontend is its own TypeScript project (own tsconfig, own Vitest
    # suite). The root `tsc --noEmit` in `lint` only covers the backend, so
    # without this job neither the Next.js types nor the 140+ Vitest tests
    # under frontend/src ever run in CI (issue #709).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Workspace install from the root: frontend is an npm workspace, so its
      # dependencies come from the root lockfile and the shared npm cache.
      - run: npm ci --ignore-scripts
      - name: Frontend type check
        run: npm --prefix frontend run typecheck
      - name: Frontend unit tests (Vitest)
        run: npm --prefix frontend run test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # npm's legacy quick-audit endpoint (/-/npm/v1/security/audits/quick)
      # has been retired server-side; older npm CLI versions still call it
      # and get errors unrelated to this repo's dependencies. Newer npm only
      # uses the bulk advisory endpoint. Upgrade npm itself, not the audit
      # command or its blocking behavior.
      - name: Update npm
        run: npm install -g npm@latest
      # The blocking gate audits only the production dependency tree. A
      # devDependency advisory (vitest, tinypool, lint-staged) never reaches a
      # user, and letting one fail the build permanently trains people to
      # ignore red CI. Dev-only findings are surfaced by the next step instead.
      - name: Audit production dependencies (with retry)
        run: |
          max_attempts=3
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "::group::npm audit attempt $attempt/$max_attempts"
            set +e
            output=$(npm audit --omit=dev --audit-level=critical 2>&1)
            exit_code=$?
            set -e
            echo "$output"
            echo "::endgroup::"

            if [ $exit_code -eq 0 ]; then
              echo "✓ npm audit passed for production dependencies"
              exit 0
            fi

            # Check if failure is due to registry/network errors (not real vulnerabilities)
            if echo "$output" | grep -qiE '(ECONNREFUSED|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|fetch failed|request to .* failed|429|503|registry error|Unexpected token|Unexpected end of JSON)'; then
              echo "::warning::npm audit attempt $attempt failed due to registry/network error"
              if [ $attempt -lt $max_attempts ]; then
                echo "Retrying in 10s..."
                sleep 10
              fi
            else
              # Real vulnerability findings — fail immediately
              echo "::error::npm audit found critical vulnerabilities in the production tree"
              exit $exit_code
            fi
          done

          # All retries exhausted due to registry errors
          echo "::warning title=npm audit skipped::All $max_attempts attempts failed due to npm registry errors (possible brownout). Audit was not evaluated — review manually."
          exit 0

      # Dev-only advisories are reported so they stay visible without failing
      # the build. Today that means vitest and tinypool (see issue #776): both
      # are test tooling, neither is in the production tree, and lifting them
      # needs a vitest 3 -> 5 migration that is blocked on jest-dom matcher
      # types not merging with vitest 5's two-parameter Assertion interface.
      - name: Report devDependency advisories (non-blocking)
        run: |
          set +e
          output=$(npm audit --audit-level=critical 2>&1)
          exit_code=$?
          set -e
          echo "$output"
          if [ $exit_code -ne 0 ]; then
            echo "::warning::DevDependency advisories are present. They do not ship to users and do not fail this build."
          fi
